<!-- ══ 概念小測：樣式 ══ -->
<style>
  #quiz{margin-top:14px}
  #quiz .qhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:4px}
  #quiz h2{margin:0;font-size:17px;font-weight:650;color:#8b6914;
    font-family:"Songti TC","Noto Serif TC",Georgia,serif;letter-spacing:.04em}
  #quiz .qsub{font-size:12px;color:#6b6b73}
  #score{font-size:13px;font-weight:700;color:#8b6914;background:rgba(201,162,39,.14);
    border:1px solid rgba(184,134,11,.35);border-radius:20px;padding:4px 13px}
  .qitem{background:#fff;border:1px solid #d4d4d8;border-radius:11px;padding:18px 20px;margin-top:14px;
    box-shadow:0 1px 2px rgba(60,60,67,.05),0 6px 18px rgba(60,60,67,.05)}
  .qitem .qno{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#9a9aa2}
  .qitem .qtext{font-size:14.5px;line-height:1.8;color:#2b2b30;margin:7px 0 13px}
  .qopts{display:flex;flex-direction:column;gap:8px}
  .qopt{display:flex;gap:11px;align-items:flex-start;text-align:left;cursor:pointer;
    background:#fbfbfd;border:1px solid #e2e2e6;border-radius:9px;padding:11px 14px;
    font-size:14px;line-height:1.65;color:#3c3c43;font-family:inherit;transition:.16s}
  .qopt:hover{border-color:#c9a227;background:rgba(201,162,39,.07)}
  .qopt .key{flex:0 0 22px;height:22px;border-radius:50%;border:1.5px solid #c9c9d0;color:#77777f;
    font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .qopt.right{border-color:#2f9e6f;background:rgba(47,158,111,.09)}
  .qopt.right .key{border-color:#2f9e6f;background:#2f9e6f;color:#fff}
  .qopt.wrong{border-color:#c0455f;background:rgba(192,69,95,.08)}
  .qopt.wrong .key{border-color:#c0455f;background:#c0455f;color:#fff}
  .qopt[disabled]{cursor:default}
  .qexp{margin-top:12px;font-size:13.4px;line-height:1.85;color:#4a4a52;
    background:#fbf8ef;border-left:3px solid #c9a227;border-radius:0 8px 8px 0;padding:12px 15px;display:none}
  .qexp.show{display:block}
  .qexp b{color:#8b6914}
  .qexp .verdict{font-weight:700;display:block;margin-bottom:5px}
  .qexp .verdict.ok{color:#2f9e6f}.qexp .verdict.no{color:#c0455f}
  .qreset{margin-top:16px;background:#fff;border:1px solid #d4d4d8;border-radius:8px;
    color:#8b6914;font-size:13px;font-weight:650;padding:8px 16px;cursor:pointer}
  .qreset:hover{border-color:#c9a227;background:rgba(201,162,39,.08)}
</style>

<!-- ══ 概念小測：結構（放在 canvas 與「快捷情境」卡之間） ══ -->
<section class="card" id="quiz" style="margin-top:14px">
  <div class="qhead">
    <h2>DSE 概念小測 · Circular Motion</h2>
    <span class="qsub">點選答案即時對答，附完整拆解</span>
    <span id="score">得分 0 / 6</span>
  </div>
  <div id="qlist"></div>
  <button class="qreset" id="qreset">重做全部</button>
</section>

<script>
/* ══ 概念小測引擎：題目同本頁模擬場景一一對應 ══ */
(function () {
  var QUESTIONS = [
    { q: '質量 m 的物件以繩繫住，在光滑水平面上作等速率圓周運動。若速率加倍而半徑不變，繩的張力變為原來的多少倍？',
      o: ['1/2 倍', '2 倍', '4 倍', '不變'], a: 2,
      e: '<b>F_c = mv²/r。</b>m、r 固定時 F_c ∝ v²。v → 2v 即 F_c → 4F_c。<br>對應模擬 ①：把速率由 6 m/s 改成 12 m/s，面板 F_c 由 45 N 跳到 180 N。<br><b>陷阱：</b>答「2 倍」係把平方關係誤當線性；DSE 幾乎每年都考 ∝v² 或 ∝1/r。' },
    { q: '物件作等速率圓周運動期間，下列敘述何者正確？',
      o: ['速度向量不變', '加速度恆指向圓心，大小不變', '加速度沿切線方向，使速率改變', '合外力為零，因為速率不變'], a: 1,
      e: '<b>方向不斷改變 ⇒ 必有加速度。</b>加速度恆指向圓心（centripetal），大小 a_c = v²/r，只改方向不改速率。<br><b>陷阱：</b>「速率不變 ⇒ 合外力為零」係最典型迷思；只要方向變，合力就唔係零。' },
    { q: '圓錐擺（conical pendulum）中，小球在水平面作等速率圓周運動，繩與鉛垂線成角 θ。若把小球的質量加倍（r、ω 不變），下列何者<b>不變</b>？',
      o: ['繩張力 T', 'θ 角', '向心力 F_c', '繩的豎直分量 T cosθ'], a: 1,
      e: '<b>豎直 T cosθ = mg、水平 T sinθ = mω²r。</b>兩式相除消去 m 得 tanθ = ω²r/g ⇒ θ 只由 ω、r 決定，與 m 無關。<br>m 加倍時：T = mg/cosθ 加倍、F_c = mω²r 加倍、T cosθ 加倍。<br><b>陷阱：</b>以為「重啲會擺得低啲」；實驗上 θ 完全唔變，只有繩更緊。' },
    { q: '小球以繩在鉛垂面內作圓周運動。若小球在最高點的速率剛好等於 √(gr)，則最高點時繩的張力為？',
      o: ['mg', '2mg', 'mg/2', '零'], a: 3,
      e: '<b>最高點：T + mg = mv²/r。</b>代入 v² = gr ⇒ T + mg = mg ⇒ T = 0，即臨界狀態（繩剛鬆）。<br><b>陷阱：</b>寫成 T − mg 會得出 T = 2mg；方向搞反係最常失分位。鉛垂圓周最高點重力已向下（指向圓心），重力已提供部分 F_c。' },
    { q: '汽車以設計速率（design speed）通過斜坡彎道，不倚賴摩擦力。此時提供向心力的力是？',
      o: ['路面對車的摩擦力', '法向力 N 的水平分量', '車重 mg 的水平分量', '離心力'], a: 1,
      e: '<b>設計速率時：N cosθ = mg、N sinθ = mv²/r</b>（θ 為路面傾角），相除得 v = √(rg tanθ)。向心力全部來自 N 的水平分量。<br><b>陷阱：</b>「車重水平分量」錯——mg 係鉛垂向下，冇水平分量；寫「離心力」直接扣分，DSE 不接受 centrifugal force。' },
    { q: '唱片以 33⅓ rpm 轉動。2.0 分鐘內，唱片共轉了多少圈？',
      o: ['33 圈', '50 圈', '67 圈', '100 圈'], a: 2,
      e: '<b>33⅓ rpm = 每分鐘 33⅓ 圈</b>⇒ 2 分鐘 = 66⅔ ≈ 67 圈。<br>若要用角速度：ω = 2πn/60 = 2π(33.33)/60 = 3.49 rad s⁻¹，θ = ωt = 3.49 × 120 = 419 rad，圈數 = 419/2π = 66.7。<br><b>陷阱：</b>漏 ÷60 或把 rpm 當 rad/s；單位換算錯會令全題連鎖出錯。' }
  ];

  var listEl = document.getElementById('qlist'), scoreEl = document.getElementById('score');
  function build() {
    scoreEl.textContent = '得分 0 / ' + QUESTIONS.length;
    listEl.innerHTML = QUESTIONS.map(function (item, qi) {
      var opts = item.o.map(function (text, oi) {
        return '<button class="qopt" data-q="' + qi + '" data-o="' + oi + '">' +
               '<span class="key">' + 'ABCD'[oi] + '</span><span>' + text + '</span></button>';
      }).join('');
      return '<div class="qitem"><div class="qno">Question ' + (qi + 1) + '</div>' +
             '<div class="qtext">' + item.q + '</div><div class="qopts">' + opts + '</div>' +
             '<div class="qexp" id="exp-' + qi + '"></div></div>';
    }).join('');
  }
  var answered = {}, correct = 0;
  listEl.addEventListener('click', function (e) {
    var btn = e.target.closest('.qopt'); if (!btn) return;
    var qi = +btn.dataset.q, oi = +btn.dataset.o;
    if (answered[qi] !== undefined) return;
    answered[qi] = oi;
    var item = QUESTIONS[qi], ok = oi === item.a;
    if (ok) correct++;
    scoreEl.textContent = '得分 ' + correct + ' / ' + QUESTIONS.length;
    listEl.querySelectorAll('.qopt[data-q="' + qi + '"]').forEach(function (b) {
      b.disabled = true;
      var bo = +b.dataset.o;
      if (bo === item.a) b.classList.add('right');
      else if (bo === oi) b.classList.add('wrong');
    });
    var exp = document.getElementById('exp-' + qi);
    exp.innerHTML = '<span class="verdict ' + (ok ? 'ok' : 'no') + '">' +
      (ok ? '正確' : '正確答案：' + 'ABCD'[item.a]) + '</span>' + item.e;
    exp.classList.add('show');
  });
  document.getElementById('qreset').addEventListener('click', function () {
    answered = {}; correct = 0; build();
  });
  build();
})();
</script>
